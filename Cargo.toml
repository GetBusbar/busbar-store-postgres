# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `cargo xtask fleet render busbar-store-postgres` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/workspace-Cargo.toml; `cargo xtask fleet check` is red on any edit here.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic
# (`store-postgres/`, the rlib a busbar build can link) and the thin cdylib that packages it as a
# droppable `kind: store` plugin (`store-postgres-plugin/`, crate `busbar-store-postgres-plugin`). Its busbar
# dependencies are git dependencies on GetBusbar/busbar at the fleet pin (`.busbar-ref` field 1);
# no sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "store-postgres",
    "store-postgres-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-store-postgres"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "c7cc4f6696d53654ba1ac4f8e8c4fad0b9cd9df8" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "c7cc4f6696d53654ba1ac4f8e8c4fad0b9cd9df8" }
