# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `busbar-release plugin heal busbar-store-postgres` from GetBusbar/busbar-release template/ and
# GetBusbar/busbar's dependency policy; a hand edit is overwritten by the next sync.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic (the rlib a
# busbar build links) and the thin cdylib that packages it as a droppable `kind: store` plugin
# (crate `busbar-store-postgres-plugin`). Its runtime busbar dependency is busbar-contract; busbar-plugin-loader
# is dev-only for ordinary linked and dropped-in tests. All Git dependencies on
# GetBusbar/busbar at the pin in `.busbar-ref`; no sibling-checkout path dependency ships in any manifest.
#
# THIRD-PARTY VERSIONS ARE THE FLEET'S, NOT THIS REPO'S. The table below is busbar's own root
# `[workspace.dependencies]` (third-party rows) at busbar 892773b8ed5d0cc78694bbcf5a10d89346ad61e6, followed by the plugin-only rows
# of busbar's `.github/fleet/deps.toml` at 892773b8ed5d0cc78694bbcf5a10d89346ad61e6. A member takes a crate with
# `{ workspace = true }` (adding features if it needs them); a crate in neither table is a new
# `deps.toml` row in busbar first. Heal seeds resolution from busbar's lock at the pin; this
# plugin retains its own Cargo.lock and CI checks its pinned core revision and dependency policy.
[workspace]
resolver = "2"
members = [
    "store-postgres",
    "store-postgres-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-store-postgres"

# The ONE fleet clippy allowance (coordinator ruling (a), 2026-10-19): every plugin-built ABI literal
# spreads `..Type::ZERO` (the zero-spread guard, busbar #1207), which a literal naming every field
# today trips as needless_update. Members take it with `[lints] workspace = true`.
[workspace.lints.clippy]
needless_update = "allow"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "16530bfbda93e34caa5bbf81b8e6c65307305477" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "16530bfbda93e34caa5bbf81b8e6c65307305477" }
"busbar-core-connector" = { "features" = ["test-support"], "git" = "https://github.com/GetBusbar/busbar", "rev" = "16530bfbda93e34caa5bbf81b8e6c65307305477" }
"busbar-transport-tcp" = { "git" = "https://github.com/GetBusbar/busbar-transport-tcp", "rev" = "7cdbb13a62e15216fd9d2b89ef42c3646b6c2a72" }
