# RENDERED by `busbar-release plugin heal` from GetBusbar/busbar-release template/.
# Codecov is INFORMATIONAL, never a gate: the correctness gate is the `ci` workflow (busbar's
# plugin-ci.yml at the pin). Every status is informational, there are no PR comments, and test-only paths
# are excluded from the percentage (and, for a plugin whose end-to-end tests build a busbar checkout,
# that checkout).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "**/tests"
  - "**/tests.rs"
  - "busbar"
