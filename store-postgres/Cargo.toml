# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-postgres"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "PostgreSQL primitive persistence over the host connector, with automatic native historical upgrades."

[lints]
workspace = true

[dependencies]
# Owner-side credential normalization and SCRAM public framing.
base64 = { workspace = true }
getrandom = { workspace = true }
stringprep = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
# The ONE busbar crate this plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK
# into it as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`;
# a busbar build that links this crate `[patch]`es the busbar git source to its own tree, so ONE
# copy of the contract links.
busbar-contract = { workspace = true }
zeroize = { workspace = true }
# The Postgres frontend protocol WITHOUT a socket (busbar THE DESIGN, the connections section: the
# store reaches its server only over the host's connector): the message codec, SCRAM-SHA-256 and md5
# (`postgres-protocol`) and the binary value encodings (`postgres-types`), the same two crates the
# 1.5.5 `postgres` driver encoded and decoded with, so every parameter and column reads as before.
postgres-protocol = { workspace = true }
postgres-types = { workspace = true }
bytes = { workspace = true }
fallible-iterator = { workspace = true }
serde_json = { workspace = true }
# Operation receipt maintenance diagnostics.
tracing = { workspace = true }

[dev-dependencies]
# Independent SCRAM oracle for the transferred protocol vectors.
ring = { workspace = true }
# Real core identity ownership crossing over the staged native door (test-only).
busbar-kernel = { workspace = true }
jsonschema = { workspace = true }
# The unavailable-reason log test installs a capturing subscriber.
tracing-subscriber = { workspace = true }
# The live tests open the store through the REAL loader on a dispatcher, its connections over the
# loader's test connection table (`tcp_conns`, `test-support`), and verify on an independent
# connection of the `postgres` driver's own.
busbar-plugin-loader = { workspace = true , features = ["test-support"] }
postgres = { workspace = true }
# The TLS test (`src/tests/tls.rs`): an in-test TLS proxy in front of the live server, its CA minted
# per run; the store's side is the loader's test table trusting that CA. Test-only.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }

busbar-core-connector = { workspace = true }
busbar-transport-tcp = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
busbar-contract = { workspace = true, features = ["test-seal"] }
