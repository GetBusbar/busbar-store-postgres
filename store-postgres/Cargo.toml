# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-postgres"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The Postgres backend for busbar's durable governance store — the shared, multi-node db plugin. Implements busbar_contract::records::RecordStore over a mutex-guarded sync postgres client."
license = "Apache-2.0"

[dependencies]
# The ONE busbar crate this plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK
# into it as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`;
# a busbar build that links this crate `[patch]`es the busbar git source to its own tree, so ONE
# copy of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "e1d3d8b097201859751d77208e66249d98b50a4b" }
postgres = "0.19"
serde_json = "1"

[dev-dependencies]
# The `Store` contract conformance suite used to arrive here as `busbar-plugin-testkit`; the owner
# ruled that crate DELETED on 2026-09-22 and #2/#31 forbid a shared test util between plugins, so
# this crate owns its copy at `src/tests/store_conformance.rs` (verbatim from busbar's in-tree copy).
# Its plane-record checks serialize stand-in rows with serde derive, hence this one dev-dependency;
# no busbar crate beyond `busbar-contract` is needed.
serde = { version = "1", features = ["derive"] }
