# RENDERED by `busbar-release plugin sync` from GetBusbar/busbar-release template/.
# Dependency updates target dev. GitHub Actions are pinned by the fleet template (busbar-release),
# so only cargo is watched here. Every update of an ecosystem is ONE grouped PR, and
# .github/workflows/dependabot-bundle.yml folds all of them into one branch and one PR (DEPENDABOT-ONE).
# The crates busbar's dependency policy owns (busbar's root [workspace.dependencies] and
# .github/fleet/deps.toml) are ignored here: they move centrally, in busbar, and reach this repo
# through `busbar-release plugin sync` with the pin, so Cargo.lock stays at parity with busbar's.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "a2a-lf"
      - dependency-name: "a2a-pb"
      - dependency-name: "arc-swap"
      - dependency-name: "async-trait"
      - dependency-name: "axum"
      - dependency-name: "base64"
