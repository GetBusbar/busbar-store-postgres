# RENDERED by `busbar-release plugin heal busbar-store-postgres` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

# Nothing by default: each job below is granted exactly what the workflow it calls needs, and is
# passed only the secrets that workflow declares (never every secret wholesale).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # No secrets: the tagged commit's CI needs none (coverage upload skips without CODECOV_TOKEN).
  release:
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@1f834fcaf3f3e3cddd73749b9776c8814fab189b
    with:
      plugin_crate: busbar-store-postgres-plugin
      manifest_name: busbar-store-postgres
      plugin_alias: postgres
      plugin_kind: store
      asset_prefix: busbar-store-postgres
      description: "First-party signed kind:store plugin cdylib: the Postgres backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: postgres to share virtual keys, budgets, and usage across a fleet of busbar nodes."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "store-postgres/declares.json"
      former_names: "busbar-store-postgres-plugin"
    secrets:
      BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@1f834fcaf3f3e3cddd73749b9776c8814fab189b
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-store-postgres
      plugin_name: busbar-store-postgres
      plugin_alias: postgres
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
