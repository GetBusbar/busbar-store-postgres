# RENDERED by `busbar-release plugin heal busbar-store-postgres` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Weekly: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots once it is out.
name: consumer-verify

on:
  schedule:
    - cron: "10 9 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@947ff1f347d1c5b6e118419363376b9da90d4087
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-store-postgres
      plugin_name: busbar-store-postgres
      plugin_alias: postgres
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
