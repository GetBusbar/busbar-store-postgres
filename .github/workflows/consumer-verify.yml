# RENDERED by `busbar-release plugin heal busbar-store-postgres` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@7356bbfb6baeb0e9245a59dc74f8b4bfadb2c5a4
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-store-postgres
      plugin_name: busbar-store-postgres
      plugin_alias: postgres
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
