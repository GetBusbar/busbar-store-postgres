# `.github/fleet/deps.toml` at dd9637da0c849b811238e108cbafabcb4c7c22a2; a hand edit is overwritten by the next sync. CI runs
# `cargo deny check` on it (busbar's plugin-ci.yml at the pin). The license allowlist is busbar's own;
# the one reviewed git source is busbar itself, at the pin.
[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
