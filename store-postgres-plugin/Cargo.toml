# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-postgres-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the Postgres backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: postgres to share virtual keys, budgets, and usage across a fleet of busbar nodes."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery (all the SQL/logic lives in busbar-store-postgres); rlib matches the
# sibling plugins' convention (auth-oidc-plugin, webrequest-hook) and is REQUIRED for `cargo test` to
# actually emit the cdylib artifact at all — with cdylib-only, `cargo test --workspace` builds a
# trivial "0 tests" harness for this package but never produces the .so/.dylib, so
# tests/admin_api_e2e.rs's own dlopen of its "real built cdylib" silently found nothing (confirmed:
# `find target/release -iname '*store_postgres_plugin*'` after a bare `cargo test --workspace
# --release` showed no .so, only the test harness binary).
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-store-postgres-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[dependencies]
# THE LOGIC, same repo. Its `store_door!` defines the store's one `door`; this crate only exports
# that door as the image's one symbol (`busbar_plugin_door`, the contract's `export_door!`).
busbar-store-postgres = { path = "../store-postgres" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "e1d3d8b097201859751d77208e66249d98b50a4b" }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-store-postgres-plugin = { path = ".", features = ["dropped-in"] }
# The conformance and end-to-end tests load the built cdylib over the REAL loader (sign, pack, scan,
# open) and the linked row through the same registry — dev-only, never in the shipped artifact. Same
# pinned rev as the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "e1d3d8b097201859751d77208e66249d98b50a4b" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "e1d3d8b097201859751d77208e66249d98b50a4b" }
serde_json = "1"
postgres = "0.19"
# For admin_api_e2e.rs: drives the real busbar admin HTTP API (install/mint) against an
# OUT-OF-PROCESS busbar the same way e2e.rs drives busbar itself -- fully synchronous, no tokio
# runtime (the plain `postgres` sync client used for independent verification can't be called from
# inside an async/tokio context; `reqwest::blocking` sidesteps that entirely and keeps this test's
# style consistent with e2e.rs). Same reqwest/base64 versions busbar core's own
# crates/busbar/src/admin/tests/tests.rs uses, minus the async-only features it needs for its
# in-process axum server.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
base64 = "0.22"
