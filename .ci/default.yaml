# busbar-store-postgres: what a change must pass to enter dev, judged by ModernCI in SHADOW (it records,
# never writes to the forge). Ported from busbar's reusable plugin-ci.yml (the pin and linux jobs;
# the macOS leg stays on GitHub Actions, non-required: ModernCI has no macOS backend). Generated by
# ModernCI from this repo's .github/workflows/ci.yml inputs; the program is PLUGIN_CI below.
to: dev
on_green: merge
deadline: 2h
env:
  PLUGIN_REPO: "busbar-store-postgres"
  PLUGIN_SERVICE: "postgres"
  PLUGIN_BUSBAR_CHECKOUT: "true"
  PLUGIN_EXTRA_TEST: ""
  PLUGIN_CRATE: "busbar-store-postgres-plugin"
  PLUGIN_KIND: "store"
  PLUGIN_ALIAS: "postgres"
  PLUGIN_MANIFEST_NAME: ""
  PLUGIN_LANG: "rust"
  PLUGIN_C_DIR: ""
  CARGO_TERM_COLOR: "never"
  PLUGIN_CI: |
    # plugin-ci for ModernCI: busbar's reusable plugin-ci.yml (pin f6376ed) as one bash program.
    # Called as `bash -c "$PLUGIN_CI" plugin-ci <pin|linux>` with PLUGIN_* set by the branch file.
    # The GitHub layout is kept: $GITHUB_WORKSPACE/plugin is this checkout, $GITHUB_WORKSPACE/busbar is
    # busbar at the plugin's .busbar-ref pin, so busbar's own scripts read the paths they always did.
    set -uo pipefail
    job="${1:?pin or linux}"
    REPO="$PLUGIN_REPO"
    here="$PWD"
    W="$(mktemp -d "${TMPDIR:-/tmp}/plugin-ci.XXXXXX")"
    export GITHUB_WORKSPACE="$W" RUNNER_TEMP="$W/tmp"
    mkdir -p "$RUNNER_TEMP"
    ln -s "$here" "$W/plugin"
    cleanup() {
      for c in ${SVC_CONTAINER:-}; do docker rm -f "$c" >/dev/null 2>&1 || true; done
      rm -rf "$W"
    }
    trap cleanup EXIT
    cd "$W"

    # ---- tools: rust 1.98.0 (rustup, sha-pinned), jq, cargo-deny; cached, never a package manager ----
    T="${MODERNCI_CACHE_DIR:-$HOME/.cache}/plugin-ci-tools"
    mkdir -p "$T"
    arch="$(uname -m)"
    case "$arch" in
      x86_64)  RT=x86_64-unknown-linux-gnu;  RSHA=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
               JQ=jq-linux-amd64; JQSHA=5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
               DENY=x86_64-unknown-linux-musl; DENYSHA=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
      aarch64) RT=aarch64-unknown-linux-gnu; RSHA=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
               JQ=jq-linux-arm64; JQSHA=4dd2d8a0661df0b22f1bb9a1f9830f06b6f3b8f7d91211a1ef5d7c4f06a8b4a5
               DENY=aarch64-unknown-linux-musl; DENYSHA=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
      *) echo "plugin-ci: no pinned tools for $arch"; exit 1 ;;
    esac
    fetch() { # url sha256 dest
      if [ -f "$3" ] && echo "$2  $3" | sha256sum -c - >/dev/null 2>&1; then return 0; fi
      curl -fsSL --retry 3 -o "$3.part.$$" "$1" && echo "$2  $3.part.$$" | sha256sum -c - >/dev/null && mv "$3.part.$$" "$3"
    }
    tools() {
      export RUSTUP_HOME="$T/rustup" CARGO_HOME="$T/cargo"
      if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
        fetch "https://static.rust-lang.org/rustup/archive/1.28.2/$RT/rustup-init" "$RSHA" "$T/rustup-init" || return 1
        chmod +x "$T/rustup-init"
        "$T/rustup-init" -y --no-modify-path --default-toolchain none || return 1
      fi
      export PATH="$CARGO_HOME/bin:$PATH" RUSTUP_TOOLCHAIN=1.98.0
      rustup toolchain install 1.98.0 --profile minimal -c clippy -c rustfmt >/dev/null || return 1
      mkdir -p "$T/bin"
      fetch "https://github.com/jqlang/jq/releases/download/jq-1.7.1/$JQ" "$JQSHA" "$T/bin/jq" && chmod +x "$T/bin/jq" || return 1
      export PATH="$T/bin:$PATH"
    }

    busbar_at() { # busbar_at <sha> [sparse path]
      git init -q "$W/busbar" && git -C "$W/busbar" remote add origin https://github.com/GetBusbar/busbar.git || return 1
      if [ -n "${2:-}" ]; then git -C "$W/busbar" sparse-checkout set "$2" || return 1; fi
      git -C "$W/busbar" fetch -q --depth 1 --no-tags origin "$1" && git -C "$W/busbar" -c advice.detachedHead=false checkout -q FETCH_HEAD
    }

    pin_sha() {
      local sha
      sha="$(awk '{print $1; exit}' plugin/.busbar-ref)"
      [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "plugin-ci: .busbar-ref field 1 is not a full 40-hex sha: '$sha'" >&2; return 1; }
      echo "$sha"
    }

    # ---- the pin job: the busbar pin is one commit ----
    if [ "$job" = pin ]; then
      sha="$(pin_sha)" || exit 1
      busbar_at "$sha" scripts/fleet || { echo "plugin-ci: busbar $sha could not be fetched"; exit 1; }
      bash busbar/scripts/fleet/pin-check.sh --selftest || exit 1
      PIN_CHECK_LANG="$PLUGIN_LANG" bash busbar/scripts/fleet/pin-check.sh plugin
      exit $?
    fi
    [ "$job" = linux ] || { echo "plugin-ci: unknown job $job"; exit 2; }

    # ---- the linux job: fmt, clippy, build, test, conformance ----
    fail=0
    step() { # step <always|ok> <name> <function>
      local when="$1" name="$2"; shift 2
      if [ "$fail" -ne 0 ] && [ "$when" != always ]; then echo "--- skipped (an earlier step failed): $name"; return 0; fi
      echo "=== $name"
      if ( set -euo pipefail; "$@" ); then return 0; fi
      echo "!!! FAILED: $name"; fail=1; return 1
    }
    free_port() { local p; while :; do p=$(( 20000 + RANDOM % 20000 )); (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null || { echo "$p"; return; }; done; }
    SVC_CONTAINER=""
    services() {
      local n="plugin-ci-$PLUGIN_SERVICE-$(git -C "$here" rev-parse --short=12 HEAD)-$$" p tries
      # Leftovers of runs that died before their trap: past their expiry label, or (older runs, no
      # label) created over 3 h ago. Only this program's own containers (name prefix plugin-ci-).
      local c exp created now; now=$(date +%s)
      for c in $(docker ps -aq --filter name=^plugin-ci- 2>/dev/null); do
        exp=$(docker inspect -f '{{index .Config.Labels "plugin-ci.expires"}}' "$c" 2>/dev/null)
        if [ -z "$exp" ]; then created=$(date -d "$(docker inspect -f '{{.Created}}' "$c")" +%s 2>/dev/null || echo "$now"); exp=$(( created + 10800 )); fi
        [ "$exp" -lt "$now" ] 2>/dev/null && docker rm -f "$c" >/dev/null 2>&1 || true
      done
      local L="--label plugin-ci.expires=$(( now + 10800 ))"
      case "$PLUGIN_SERVICE" in
        none) return 0 ;;
        postgres) p=$(free_port)
          docker run -d $L --name "$n" -e POSTGRES_USER=busbar -e POSTGRES_PASSWORD=busbar -e POSTGRES_DB=busbar_test -p "127.0.0.1:$p:5432" \
            postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b >/dev/null
          SVC_CONTAINER="$n"; ready() { docker exec "$n" pg_isready -U busbar >/dev/null 2>&1; }
          export BUSBAR_TEST_POSTGRES_URL="postgres://busbar:busbar@localhost:$p/busbar_test" ;;
        mysql) p=$(free_port)
          docker run -d $L --name "$n" -e MYSQL_ROOT_PASSWORD=busbar -e MYSQL_USER=busbar -e MYSQL_PASSWORD=busbar -e MYSQL_DATABASE=busbar_test -p "127.0.0.1:$p:3306" \
            mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb >/dev/null
          SVC_CONTAINER="$n"; ready() { docker exec "$n" mysqladmin ping -h localhost -ubusbar -pbusbar >/dev/null 2>&1; }
          export BUSBAR_TEST_MYSQL_URL="mysql://busbar:busbar@127.0.0.1:$p/busbar_test" ;;
        valkey) p=$(free_port)
          docker run -d $L --name "$n" -p "127.0.0.1:$p:6379" valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6 >/dev/null
          SVC_CONTAINER="$n"; ready() { docker exec "$n" valkey-cli ping >/dev/null 2>&1; }
          export VALKEY_URL="redis://127.0.0.1:$p/0" ;;
        vault) p=$(free_port)
          docker run -d $L --name "$n" --cap-add=IPC_LOCK -e VAULT_DEV_ROOT_TOKEN_ID=root -p "127.0.0.1:$p:8200" \
            hashicorp/vault@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2 >/dev/null
          SVC_CONTAINER="$n"; ready() { docker exec "$n" wget -qO- http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1; }
          export BUSBAR_TEST_VAULT_ADDR="http://127.0.0.1:$p" BUSBAR_TEST_VAULT_TOKEN=root ;;
        wiremock) p=$(free_port)
          docker run -d $L --name "$n" -p "127.0.0.1:$p:8080" wiremock/wiremock:3.9.2@sha256:d13997cd7b52583528a766019cfe7d4e91c4d224a67bdaa6f60efbb532f32176 >/dev/null
          SVC_CONTAINER="$n"; ready() { curl -fsS "http://127.0.0.1:$p/__admin/mappings" >/dev/null 2>&1; }
          export BUSBAR_TEST_WIREMOCK_URL="http://127.0.0.1:$p" ;;
        openldap) p=$(free_port)
          # The pinned image is linux/amd64 only: it runs under the backend's amd64 emulation.
          docker run -d $L --platform linux/amd64 --name "$n" -e LDAP_ORGANISATION="Example Org" -e LDAP_DOMAIN=example.org -e LDAP_ADMIN_PASSWORD=adminpassword \
            -p "127.0.0.1:$p:389" osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28 >/dev/null
          SVC_CONTAINER="$n"; ready() { (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null; }
          export BUSBAR_TEST_LDAP_URL="ldap://127.0.0.1:$p" ;;
        *) echo "plugin-ci: unknown service '$PLUGIN_SERVICE'"; return 1 ;;
      esac
      for tries in $(seq 1 60); do ready && return 0; sleep 2; done
      echo "plugin-ci: the $PLUGIN_SERVICE service did not come up"; docker logs "$n" 2>&1 | tail -20; return 1
    }
    has_dropped_in() { cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; sys.exit(0 if any(p["name"]==sys.argv[1] and "dropped-in" in p["features"] for p in json.load(sys.stdin)["packages"]) else 1)' "$PLUGIN_CRATE"; }

    s_checkout() {
      sha="$(pin_sha)"; busbar_at "$sha"
    }
    s_env() {
      export BUSBAR_GOLDEN_DIR="$W/busbar/testing/shadow-oracle/golden"
      if [ "$PLUGIN_BUSBAR_CHECKOUT" = true ]; then
        export BUSBAR_CHECKOUT="$W/busbar" BUSBAR_TARGET_DIR="$W/busbar/target" CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
      fi
    }
    s_gates() { (cd busbar && cargo build --locked -q -p xtask && target/debug/xtask plugin-gates selftest); }
    s_fmt() { (cd plugin && cargo fmt --all -- --check); }
    s_clippy() { (cd plugin && cargo clippy --workspace --all-targets --locked -- -D warnings); }
    s_build() {
      cd plugin; cargo build --workspace --locked
      if has_dropped_in; then cargo build --locked -p "$PLUGIN_CRATE" --features dropped-in; fi
    }
    s_cbuild() {
      [ -n "$PLUGIN_C_DIR" ] || { echo "plugin_lang c needs c_dir"; exit 1; }
      src="$W/plugin/$PLUGIN_C_DIR"; ls "$src"/*.c >/dev/null
      lib="$W/plugin/target/debug/lib${PLUGIN_CRATE//-/_}.so"; mkdir -p "$(dirname "$lib")"
      cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC -shared -I busbar/crates/busbar-contract/include -o "$lib" "$src"/*.c
    }
    s_signing() {
      cd plugin; lib="target/debug/lib${PLUGIN_CRATE//-/_}.so"
      [ -f "$lib" ] || { echo "no cdylib at $lib"; ls -la target/debug/ >&2; exit 1; }
      bash "$W/busbar/scripts/signing-gate.sh" "$W/busbar" "$PLUGIN_CRATE" "$PLUGIN_KIND" "$PLUGIN_ALIAS" "$lib" "${PLUGIN_MANIFEST_NAME:-$REPO}"
    }
    s_mysql_strict() { docker exec "$SVC_CONTAINER" mysql -uroot -pbusbar -e "SET GLOBAL sql_mode='STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION';"; }
    s_fixture() { bash busbar/scripts/store-migration-fixture.sh check "plugin/store-$PLUGIN_ALIAS/tests/fixtures/1.5.5"; }
    s_test() { (cd plugin && cargo test --workspace --locked); }
    s_extra() { (cd plugin && bash -c "$PLUGIN_EXTRA_TEST"); }
    s_conformance() {
      cd plugin; export BUSBAR_EXPECT_RELEASE=1; feat=""; if has_dropped_in; then feat="--features dropped-in"; fi
      cargo build --release --locked -p "$PLUGIN_CRATE" --lib $feat
      suite="the_linked_and_the_dropped_in_door_are_one_plugin red_a_moved_crossing_count_is_refused red_a_door_at_another_kind_abi_is_refused red_a_failing_ready_refuses_the_boot red_a_networked_door_with_no_connection_table_is_refused the_declared_needs_are_the_statements the_suite_runs_in_the_profile_it_was_asked_to"
      list="$RUNNER_TEMP/conformance.list"
      cargo test --release --locked -p "$PLUGIN_CRATE" --test conformance -- --list > "$list" || { echo "no conformance target"; exit 1; }
      "$W/busbar/target/debug/xtask" plugin-gates bothways "$list"
      for t in $suite; do grep -qx "$t: test" "$list" || { echo "the published suite's test '$t' is not in the conformance target"; exit 1; }; done
      out="$(cargo test --release --locked -p "$PLUGIN_CRATE" --test conformance 2>&1 | tee /dev/stderr)"
      for t in $suite; do printf '%s\n' "$out" | grep -qx "test $t ... ok" || { echo "the published suite's test '$t' did not RUN green"; exit 1; }; done
      if red="$(BUSBAR_CONFORMANCE_RED=count cargo test --release --locked -p "$PLUGIN_CRATE" --test conformance -- --exact the_linked_and_the_dropped_in_door_are_one_plugin 2>&1)"; then
        printf '%s\n' "$red" >&2; echo "RED: the both-ways arm passed with a pinned crossing count moved"; exit 1
      fi
      printf '%s\n' "$red" | grep -q "crossing(s), pinned" || { printf '%s\n' "$red" >&2; echo "RED: the moved count failed for another reason"; exit 1; }
    }
    s_plane() { (cd busbar && "$W/busbar/target/debug/xtask" plugin-gates plane "$W/busbar" "$W/plugin" "${PLUGIN_CRATE%-plugin}"); }
    s_deny() {
      cd plugin
      fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-$DENY.tar.gz" "$DENYSHA" "$T/deny-$DENY.tgz"
      tar -xzf "$T/deny-$DENY.tgz" -C "$RUNNER_TEMP"; deny="$RUNNER_TEMP/cargo-deny-0.20.2-$DENY/cargo-deny"
      "$deny" --locked --format json check advisories 2> "$RUNNER_TEMP/advisories.jsonl" || true
      "$deny" --locked check
    }
    s_meta() {
      cd plugin
      cargo metadata --format-version 1 --locked --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/meta.json"
      : > "$RUNNER_TEMP/tree.txt"
      for pkg in $(cargo metadata --format-version 1 --locked --no-deps | jq -r '.packages[].name'); do
        cargo tree --locked --package "$pkg" --edges normal,build --target all --prefix none --format '{p}|{f}' >> "$RUNNER_TEMP/tree.txt"
      done
    }
    G() { "$W/busbar/target/debug/xtask" plugin-gates "$@"; }
    s_depwall() { G depwall "$RUNNER_TEMP/meta.json" "$REPO" --tree "$RUNNER_TEMP/tree.txt"; }
    s_netban() {
      rc=0
      G netban "$RUNNER_TEMP/meta.json" busbar/.github/fleet/deps.toml "$REPO" --tree "$RUNNER_TEMP/tree.txt" || rc=1
      feat=""; if (cd plugin && has_dropped_in); then feat="--features dropped-in"; fi
      (cd plugin && CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 cargo build --release --locked -p "$PLUGIN_CRATE" --lib $feat) || exit 1
      lib="plugin/target/release/lib${PLUGIN_CRATE//-/_}.so"; [ -f "$lib" ] || { echo "no cdylib at $lib"; exit 1; }
      nm -D --undefined-only "$lib" | awk '{print $NF}' > "$RUNNER_TEMP/undef.txt"
      readelf -d "$lib" | sed -nE 's/.*\(NEEDED\).*\[(.*)\].*/\1/p' > "$RUNNER_TEMP/needed.txt"
      G imports "$RUNNER_TEMP/undef.txt" "$RUNNER_TEMP/needed.txt" busbar/.github/fleet/deps.toml "$REPO" || rc=1
      rm -rf plugin/target/release
      exit $rc
    }
    s_cdeps() { G cdeps "$RUNNER_TEMP/meta.json" busbar/.github/fleet/deps.toml --tree "$RUNNER_TEMP/tree.txt"; }
    s_parity() {
      adv=(); [ -f "$RUNNER_TEMP/advisories.jsonl" ] && adv=(--advisories "$RUNNER_TEMP/advisories.jsonl")
      G parity plugin/Cargo.lock busbar/Cargo.lock busbar/.github/fleet/deps.toml "$REPO" "${adv[@]}"
    }
    s_declares() {
      f="$(cd plugin && git ls-files | grep -E '(^|/)declares\.json$' | head -n1)"
      [ -n "$f" ] || { echo "no declares.json in the repo"; exit 1; }
      G declares busbar "$PLUGIN_KIND" "plugin/$f"
    }
    s_former() {
      G former-names busbar/plugins.yaml "$REPO"
      rel=plugin/.github/workflows/release.yml
      if [ -f "$rel" ]; then
        declared="$(sed -nE 's/^[[:space:]]*former_names:[[:space:]]*"?([^"#]*)"?.*$/\1/p' "$rel" | head -n1)"
        G former-names busbar/plugins.yaml "$REPO" --declared "$declared"
      fi
    }
    s_cconf() {
      cd busbar
      out="$(cargo test --locked -p busbar-plugin-loader --test dropped_conformance -- --ignored 2>&1 | tee /dev/stderr)"
      passed="$(printf '%s\n' "$out" | sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' | awk '{s+=$1} END {print s+0}')"
      [ "$passed" -ge 2 ] || { echo "the C conformance ran $passed of its 2 tests"; exit 1; }
    }

    signing=false; case "$PLUGIN_KIND" in store|auth|hook|secret) signing=true ;; esac

    echo "=== tools (rust 1.98.0, jq)"
    tools || { echo "!!! FAILED: tools"; exit 1; }   # in this shell: PATH, RUSTUP_HOME and CARGO_HOME are the job's
    cargo --version
    present=false
    if [ -f plugin/Cargo.toml ] && (cd plugin && cargo metadata --format-version 1 --no-deps >/dev/null 2>&1); then present=true; else echo "no crates yet: the pin check is this repo's whole proof"; fi
    step ok "busbar at the pin" s_checkout || exit 1
    s_env
    echo "=== services ($PLUGIN_SERVICE)"
    services || { echo "!!! FAILED: services"; exit 1; }   # in this shell: its URLs and container name are the job's
    step ok "the plugin gates at the pin, and their selftest" s_gates
    if [ "$present" = true ]; then
      step ok fmt s_fmt; step ok "clippy (-D warnings)" s_clippy; step ok build s_build
    fi
    [ "$PLUGIN_LANG" = c ] && { step ok "C: build from busbar_plugin.h alone" s_cbuild && {
      export BUSBAR_DROPPED_LIB="$W/plugin/target/debug/lib${PLUGIN_CRATE//-/_}.so" BUSBAR_DROPPED_SOURCES="$W/plugin/$PLUGIN_C_DIR" BUSBAR_DROPPED_SCRIPT="$W/plugin/$PLUGIN_C_DIR/conformance.json"; }; }
    if [ "$signing" = true ] && { [ "$present" = true ] || [ "$PLUGIN_LANG" = c ]; }; then step ok "signing gate" s_signing; fi
    [ "$PLUGIN_SERVICE" = mysql ] && step ok "mysql strict sql_mode" s_mysql_strict
    if [ "$PLUGIN_KIND" = store ] && [ "$PLUGIN_ALIAS" != memory ] && [ "$present" = true ]; then step ok "store migration fixture" s_fixture; fi
    if [ "$present" = true ]; then
      step ok test s_test
      [ -n "$PLUGIN_EXTRA_TEST" ] && step ok "extra test command" s_extra
      step always "the published conformance suite at the pin" s_conformance
      [ "$PLUGIN_KIND" = plane ] && step always "busbar's plane gates over this plane" s_plane
      step always "cargo deny" s_deny
      if step always "the shipped closure (cargo metadata)" s_meta; then
        step always dep-wall s_depwall; step always "socket/TLS ban" s_netban; step always "C-dependency allow-list" s_cdeps
      fi
      step always "Cargo.lock parity with busbar's lock at the pin" s_parity
      step always "declares.json states the kind's contract ABI" s_declares
    fi
    step always "a renamed plugin answers its 1.5.5 manifest name" s_former
    [ "$PLUGIN_LANG" = c ] && step always "C: the kind's conformance through load_dropped" s_cconf
    exit $fail
on:
  move: [pin, linux]
checks:
  pin:
    # ci / the busbar pin is one commit
    env_from_run: []
    priority: low
    requires: [git, curl]
    run: |
      exec bash -c "$PLUGIN_CI" plugin-ci pin
  linux:
    # ci / fmt, clippy, build, test, conformance [linux]
    env_from_run: []
    priority: low
    requires: [cc, git, curl, python3-venv, docker]
    needs: [pin]
    run: |
      exec bash -c "$PLUGIN_CI" plugin-ci linux
